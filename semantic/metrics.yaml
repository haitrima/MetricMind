metrics:
  total_sales:
    description: "Total sales revenue"
    column: "Sales"
    aggregation: "sum"

  total_profit:
    description: "Total profit"
    column: "Profit"
    aggregation: "sum"

  profit_margin:
    description: "Profit margin as a percentage of total sales"
    formula: "(total_profit / total_sales) * 100"
    unit: "percent"

dimensions:
  region:
    column: "Region"
    description: "Sales region"

  product:
    column: "Product"
    description: "Product category"

  date:
    column: "Date"
    description: "Transaction date"